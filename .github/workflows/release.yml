name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LeagueClientTool.slnx

      - name: Test
        run: dotnet test LeagueClientTool.slnx --configuration Release --no-restore

      - name: Publish self-contained Windows x64 app
        run: >
          dotnet publish LeagueClientTool.App/LeagueClientTool.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          --output ./artifacts/publish

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath ./artifacts/LeagueClientTool-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/LeagueClientTool-win-x64.zip
