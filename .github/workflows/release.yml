name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LeagueClientTool.slnx

      - name: Test
        run: dotnet test LeagueClientTool.slnx --configuration Release --no-restore

      - name: Publish self-contained single-file Windows x64 app
        run: >
          dotnet publish LeagueClientTool.App/LeagueClientTool.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./artifacts/publish

      - name: Prepare standalone executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem ./artifacts/publish -Filter *.exe -File)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one executable, found $($executables.Count)."
          }

          Copy-Item $executables[0].FullName ./artifacts/LeagueClientTool.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/LeagueClientTool.exe
