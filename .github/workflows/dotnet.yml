name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LeagueClientTool.slnx

      - name: Build
        run: dotnet build LeagueClientTool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LeagueClientTool.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
